/*
 * Updated for Gradle 9.7 compatibility
 */

// 1. Use the modern 'plugins' block instead of the legacy 'apply plugin'
plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = uri("https://repo1.uhc.com/artifactory/maven-repo")
    }
}

// 2. Top-level 'sourceCompatibility' is removed in Gradle 9.
// Use the Java Toolchain (recommended) or the 'java' extension.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // 3. Simplified dependency declarations to the standard string format for cleaner readability
    api 'org.apache.commons:commons-math3:3.6.1'

    api 'org.slf4j:slf4j-api:1.7.30'
    api 'org.slf4j:slf4j-log4j12:1.7.30'
    api 'log4j:log4j:1.2.17'

    api 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'com.google.guava:guava:22.0'
    implementation 'com.googlecode.json-simple:json-simple:1.1'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

// 4. Use Task Configuration Avoidance API (tasks.named) which is heavily enforced in modern Gradle
tasks.named('test', Test) {
    useJUnitPlatform()
}